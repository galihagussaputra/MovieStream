name: moviestream

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/root/.composer/cache
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: stream_app
      DB_USERNAME: stream
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      TMDB_TOKEN: "${TMDB_TOKEN:-}"
      TMDB_SECRET: "${TMDB_SECRET:-}"
      TMDB_ENDPOINT: "${TMDB_ENDPOINT:-https://api.themoviedb.org/3/}"
      TMDB_IMAGE_URL: "${TMDB_IMAGE_URL:-https://image.tmdb.org/t/p/}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-en-US}"
      TMDB_CACHE_TTL: "${TMDB_CACHE_TTL:-600}"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "docker/php/entrypoint.sh"]

  vite:
    image: node:20-bookworm-slim
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_HMR_HOST: "${VITE_HMR_HOST:-localhost}"
      VITE_HMR_CLIENT_PORT: "${VITE_PORT:-5173}"
    command: ["sh", "-c", "npm install && npm run dev"]

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stream_app
      MYSQL_USER: stream
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  mysql-data:
